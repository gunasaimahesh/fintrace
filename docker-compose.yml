services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    ports:
      - "${FALKORDB_PUBLISHED_PORT:-6379}:6379"
      - "${FALKORDB_BROWSER_PORT:-3000}:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  falkordb_data:
